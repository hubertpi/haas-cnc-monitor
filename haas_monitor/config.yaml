name: Haas CNC Monitor
version: 0.1.3
slug: haas_cnc_monitor
image: ghcr.io/hubertpi/haas-cnc-monitor
url: https://github.com/hubertpi/haas-cnc-monitor
description: Local read-only Haas monitoring with machine management and MQTT discovery
arch:
- amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:factory
panel_title: Haas CNC Monitor
hassio_api: true
services:
- mqtt:want
options:
  mode: simulation
  hardware_testing_enabled: false
  mqtt_host: ''
  mqtt_port: 1883
  mqtt_username: ''
  mqtt_password: ''
  mqtt_tls: false
schema:
  mode: list(simulation|haas)
  hardware_testing_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_tls: bool
